<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 집 고양이 소개</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <header style="background-color: #ff9f43; padding: 20px; color: white; text-align: center;">
        <h1>🐾 우리 집 고양이 소개 페이지</h1>
    </header>

    <main style="max-width: 600px; margin: 40px auto; padding: 20px; text-align: center;">
        
        <div class="cat-card" style="border: 1px solid #eee; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
            
            <div class="cat-image-wrapper" style="margin-bottom: 20px;">
                <img src="./cat.jpg" alt="고양이 사진" style="max-width: 100%; height: auto; border-radius: 10px;">
            </div>

            <div class="cat-info">
                <h3>세상에서 가장 귀여운 고양이</h3>
                <p>드디어 깃허브 배포와 이미지 엑박까지 완벽하게 해결했습니다!</p>
            </div>
        </div>

    </main>

</body>
</html>
