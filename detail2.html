<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메리랜드 - 메리의 특징</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .profile-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .profile-table th, .profile-table td { padding: 15px; border-bottom: 1px solid #fff0e2; text-align: left; }
        .profile-table th { background-color: #ff9f43; color: white; width: 30%; }
        .feature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .feature-box { background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: left; }
        .feature-box h4 { margin-bottom: 10px; color: #ff9f43; }
        .feature-box li { margin-left: 20px; margin-bottom: 8px; color: #636e72; }
    </style>
</head>
<body>
    <header>
        <div class="logo">🐾 메리랜드</div>
        <nav><ul><li><a href="index.html">홈</a></li></ul></nav>
    </header>

    <main class="container" style="max-width: 800px; text-align: center;">
        <div class="card-img" style="padding-top: 50%; border-radius: 20px; overflow: hidden; margin-bottom: 30px;">
            <img src="ccat.jpg" alt="메리">
        </div>
        
        <h2>동글동글 입과 코를 가진 메리의 상세 프로필</h2>
        
        <table class="profile-table">
            <tr><th>이름</th><td>메리 (Merry)</td></tr>
            <tr><th>나이</th><td>아가 고양이 🐾</td></tr>
            <tr><th>취미</th><td>집사 쫓아다니기, 창밖 구경하기</td></tr>
            <tr><th>특기</th><td>귀여운 표정 지어서 간식 얻어내기</td></tr>
        </table>

        <div class="feature-grid">
            <div class="feature-box">
                <h4>❤️ 메리가 좋아하는 것</h4>
                <ul>
                    <li>바스락거리는 비닐봉지 장난감</li>
                    <li>따뜻한 햇볕이 드는 거실 바닥</li>
                    <li>참을 수 없는 맛의 츄르 간식</li>
                </ul>
            </div>
            <div class="feature-box">
                <h4>⚡ 메리가 싫어하는 것</h4>
                <ul>
                    <li>갑자기 들리는 큰 소리 (청소기 소리)
                    <li>발톱 깎는 시간 ✂️</li>
                    <li>집사가 문 닫고 방에 들어가는 것</li>
                </ul>
            </div>
        </div>
        
        <a href="index.html" class="btn" style="display: inline-block; width: auto; margin-top: 40px; padding: 12px 40px;">🏡 홈 화면으로 돌아가기</a>
    </main>
</body>
</html>
