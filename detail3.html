<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포리랜드 - 포리 사진 모음집</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-top: 30px; }
        .gallery-item { background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.05); transition: transform 0.3s ease; aspect-ratio: 1/1; }
        .gallery-item:hover { transform: scale(1.05); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>
    <header>
        <div class="logo">🐾 포리랜드</div>
        <nav><ul><li><a href="index.html">홈</a></li></ul></nav>
    </header>

    <main class="container" style="text-align: center;">
        <h2>📸 포리의 일상 사진 모음집</h2>
        <p style="color: #636e72; margin-top: 10px;">우리 귀여운 개냥이 포리의 다양한 순간들을 모아보았습니다.</p>
        
        <div class="gallery-grid">
            <div class="gallery-item"><img src="d3.jpeg" alt="포리1"></div>
            <div class="gallery-item"><img src="dd3.jpeg" alt="포리2"></div>
            <div class="gallery-item"><img src="ddd3.jpeg" alt="포리3"></div>
        </div>
        
        <a href="index.html" class="btn" style="display: inline-block; width: auto; margin-top: 50px; padding: 12px 40px;">🏡 홈 화면으로 돌아가기</a>
    </main>
</body>
</html>
